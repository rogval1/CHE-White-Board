<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Center for Housing Economics Project White Board</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#193449;background:#f4f7f9}*{box-sizing:border-box}body{margin:0}header{background:#12364b;color:white;padding:20px max(20px,calc((100vw - 1080px)/2))}header a{color:#d4e8ef;text-decoration:none}main{max-width:1080px;margin:28px auto;padding:0 18px}h1{font-size:28px;margin:5px 0 12px}h2{font-size:19px;margin:0 0 12px}h3{font-size:16px}p{color:#657886;line-height:1.5}.card{background:white;border:1px solid #dbe5eb;border-radius:13px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.category{cursor:pointer;text-align:left;font:inherit;background:white;border:1px solid #dbe5eb;border-radius:12px;padding:22px}.category:hover{border-color:#15819c}.category strong{display:block;font-size:18px}.muted{font-size:13px;color:#71818e}button,.btn{background:white;border:1px solid #b8cbd5;border-radius:8px;padding:9px 12px;color:#17465c;cursor:pointer;font-weight:600;text-decoration:none;display:inline-block}button.primary{background:#11677e;color:white;border-color:#11677e}button:disabled{opacity:.5;cursor:default}input,textarea,select{font:inherit;border:1px solid #b9cbd5;border-radius:8px;padding:10px;width:100%;background:white}textarea{min-height:90px}label{display:block;font-size:13px;font-weight:650;margin:12px 0 5px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{min-width:0}.grow{flex:1}.item{display:flex;align-items:flex-start;gap:12px;border-top:1px solid #e6edf1;padding:13px 0}.item:first-child{border-top:0}.item .grow{flex:1}.link{background:none;border:0;padding:0;color:#0d6886;text-decoration:underline;text-align:left;font:inherit;cursor:pointer}.small{font-size:12px;color:#71818e}.badge{background:#e6f2f5;color:#176076;border-radius:30px;padding:4px 9px;font-size:12px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.hidden{display:none!important}.notice{background:#fff8e9;padding:12px;border-radius:8px;color:#745a27;font-size:13px}.stack{display:grid;gap:10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}a{color:#0d6886}@media(max-width:640px){.grid,.two{grid-template-columns:1fr}header{padding:17px}h1{font-size:24px}.card{padding:15px}}</style></head><body><header><div class="toolbar"><strong>Center for Housing Economics<br>Project White Board</strong><div class="row"><a href="#home">Home</a><a href="#library">Document library</a></div></div></header><main id="app"></main><script>
const cats=['Legislation','Project Pipeline','Capital Outlay','Organizational Development'];const KEY='che-white-board-v1';let state;let db;
const seed={projects:[{id:'p-chama',name:'The Cottages at 161 Chama',category:'Project Pipeline',description:'Recovery and transitional housing',createdBy:'',createdAt:new Date().toISOString()}],tasks:[],docs:[],author:''};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);const date=()=>new Date().toISOString();const $=x=>document.getElementById(x);const proj=x=>state.projects.find(p=>p.id===x);const task=x=>state.tasks.find(t=>t.id===x);const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const route=x=>location.hash=x;
function openDB(){return new Promise((resolve,reject)=>{let r=indexedDB.open('che-white-board-files-v1',1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}function putFile(k,f){return new Promise((resolve,reject)=>{let t=db.transaction('files','readwrite');t.objectStore('files').put(f,k);t.oncomplete=resolve;t.onerror=()=>reject(t.error)})}function getFile(k){return new Promise((resolve,reject)=>{let r=db.transaction('files').objectStore('files').get(k);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function heading(title,back){return `<div class="toolbar"><h1>${esc(title)}</h1>${back?`<button data-go="${esc(back)}">← Back</button>`:''}</div>`}
function taskRow(t){let p=proj(t.projectId);return `<div class="item"><input style="width:auto;margin-top:5px" type="checkbox" data-done="${t.id}" ${t.done?'checked':''} aria-label="Mark task complete"><div class="grow"><button class="link" data-go="task/${t.id}"><strong>${esc(t.title)}</strong></button><div class="small">${esc(p?.name||'No project')} · ${esc(p?.category||'')} ${t.due?'· Due '+esc(t.due):''}${t.done?' · Completed '+esc((t.completedAt||'').slice(0,10)):''}</div></div></div>`}
function renderHome(){let active=state.tasks.filter(t=>!t.done);return `${heading('Project White Board')}<p>Projects, tasks, contacts and documents in one place.</p><div class="grid">${cats.map(c=>`<button class="category" data-go="category/${encodeURIComponent(c)}"><strong>${esc(c)}</strong><span class="muted">${state.projects.filter(p=>p.category===c).length} projects · ${state.tasks.filter(t=>!t.done&&proj(t.projectId)?.category===c).length} open tasks</span></button>`).join('')}</div><section class="card"><div class="toolbar"><h2>Outstanding tasks (${active.length})</h2><button data-go="completed">View completed (${state.tasks.filter(t=>t.done).length})</button></div>${active.length?active.map(taskRow).join(''):'<p>No outstanding tasks. Open a category to add a project and tasks.</p>'}</section><div class="card"><div class="toolbar"><h2>Document library</h2><button data-go="library">Search documents</button></div><p>${state.docs.length} saved documents. Files can be reused across multiple projects and tasks.</p></div>`}
function renderCategory(c){let ps=state.projects.filter(p=>p.category===c);return `${heading(c,'home')}<div class="card"><h2>Projects (${ps.length})</h2>${ps.map(p=>`<div class="item"><div class="grow"><button class="link" data-go="project/${p.id}"><strong>${esc(p.name)}</strong></button><div class="small">${state.tasks.filter(t=>t.projectId===p.id&&!t.done).length} outstanding tasks</div></div></div>`).join('')||'<p>No projects yet.</p>'}<h3>Add project</h3><form id="newProject" class="row"><input class="grow" name="name" placeholder="Project or bill title" required><button class="primary">Add project</button></form></div>`}
function linkedDocs(projectId,taskId){return state.docs.filter(d=>(d.projectIds||[d.projectId].filter(Boolean)).includes(projectId)||(taskId&&(d.taskIds||[d.taskId].filter(Boolean)).includes(taskId)))}
function renderProject(p){let tasks=state.tasks.filter(t=>t.projectId===p.id&&!t.done),done=state.tasks.filter(t=>t.projectId===p.id&&t.done),docs=linkedDocs(p.id);return `${heading(p.name,'category/'+encodeURIComponent(p.category))}<p>${esc(p.category)}${p.description?' · '+esc(p.description):''}</p><section class="card"><div class="toolbar"><h2>To do (${tasks.length})</h2><button id="showDone">Completed (${done.length})</button></div>${tasks.map(taskRow).join('')||'<p>No outstanding tasks.</p>'}<form id="newTask"><label>New task</label><div class="row"><input class="grow" name="title" placeholder="e.g., Contact Adam Silverman" required><input name="due" type="date" style="width:170px"><button class="primary">Add task</button></div></form><div id="donePanel" class="hidden"><h3>Completed tasks</h3>${done.map(taskRow).join('')||'<p>None yet.</p>'}</div></section><section class="card"><div class="toolbar"><h2>Project documents (${docs.length})</h2><button data-go="library">Full library</button></div>${docs.map(docRow).join('')||'<p>No documents linked to this project yet.</p>'}<div class="row"><button class="primary" data-go="attach/project/${p.id}">Find and attach from library</button><button data-go="library">Upload new document</button></div></section>`}
function docRow(d){return `<div class="item"><div class="grow"><strong>${esc(d.title)}</strong><div class="small">${esc(d.filename||d.url||'')} · ${esc(d.createdBy||'Author not specified')}</div></div><button data-open-doc="${d.id}">Open</button></div>`}
function renderTask(t){let p=proj(t.projectId),docs=linkedDocs(t.projectId,t.id);return `${heading(t.title,'project/'+t.projectId)}<p>${esc(p?.name||'')} · ${t.done?'Completed':'Outstanding'} · Created ${esc((t.createdAt||'').slice(0,10))} by ${esc(t.createdBy||'unspecified')}</p><section class="card"><div class="toolbar"><h2>Task details</h2><button class="primary" id="toggleTask">${t.done?'Reopen task':'Mark complete'}</button></div><label>Contact name</label><input id="contactName" value="${esc(t.contactName||'')}" placeholder="Name"><div class="two"><div><label>Phone</label><input id="contactPhone" value="${esc(t.contactPhone||'')}" placeholder="Phone number"></div><div><label>Email</label><input id="contactEmail" value="${esc(t.contactEmail||'')}" placeholder="Email address"></div></div><label>Notes / outcome</label><textarea id="taskNotes" placeholder="Progress, conversations, completion outcome…">${esc(t.notes||'')}</textarea><div class="row"><button class="primary" id="saveTask">Save task details</button><span class="small">Updated by ${esc(t.updatedBy||t.createdBy||'unspecified')}</span></div></section><section class="card"><h2>Documents for this task</h2>${docs.map(docRow).join('')||'<p>No documents attached.</p>'}<button data-go="attach/task/${t.id}">Attach from library</button> <button data-go="library">Upload new document</button></section><div class="notice">Contact lookup across Gmail and Google Contacts and deep email/Drive search will require a secure connected service; this version does not search those accounts automatically.</div>`}
function renderLibrary(){let docs=state.docs;return `${heading('Document library','home')}<p>Search stored documents by title, description, project, or task. Attach the same document to as many projects as needed. Add a file from your computer or save a link to a file in private cloud storage.</p><section class="card"><h2>Search library</h2><input type="search" id="docSearch" placeholder="Search saved documents…"><div id="docResults">${docs.map(docRow).join('')||'<p>No documents saved yet.</p>'}</div></section><section class="card"><h2>Upload or save document to library</h2><form id="addDoc"><label>Document title</label><input name="title" placeholder="Executed Bernalillo County agreement" required><div class="two"><div><label>Project</label><select name="projectId"><option value="">Unassigned</option>${state.projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div><label>Task (optional)</label><select name="taskId"><option value="">None</option>${state.tasks.map(t=>`<option value="${t.id}">${esc(t.title)}</option>`).join('')}</select></div></div><label>Description / keywords</label><input name="description" placeholder="Funding, agreement, County, etc."><label>Choose actual file (stored in this browser)</label><input name="file" type="file"><p class="small">Or provide a direct link to the actual document in Google Drive or another private repository:</p><input name="url" type="url" placeholder="https://drive.google.com/file/d/…"><div class="row" style="margin-top:12px"><button class="primary">Save document</button><span id="docStatus" class="small"></span></div></form></section><div class="notice">Deep search across Gmail, Google Drive and other sources is not yet connected. GitHub Pages is public; do not upload private project PDFs to the GitHub repository. Browser-stored files are device-specific and should not be treated as a permanent shared archive.</div>`}
function renderAttach(kind,target){let owner=kind==='project'?proj(target):task(target),projectId=kind==='project'?target:owner?.projectId;if(!owner)return heading('Not found','home');let attached=kind==='project'?linkedDocs(target):state.docs.filter(d=>(d.taskIds||[d.taskId].filter(Boolean)).includes(target));return `${heading('Attach documents to '+(kind==='project'?owner.name:owner.title),kind==='project'?'project/'+target:'task/'+target)}<p>Find a document already saved in the library and link it here. The original file stays in the library and can be reused across projects.</p><section class="card"><label>Search library</label><input id="attachSearch" type="search" placeholder="Try: state low income housing tax credit draft"><div id="attachResults"></div></section><section class="card"><h2>Need to add a new document?</h2><p>Upload it from your computer to the library first, then return here to attach it.</p><button data-go="library">Go to document library</button></section>`}
function renderCompleted(){let ts=state.tasks.filter(t=>t.done);return `${heading('Completed tasks','home')}<section class="card">${ts.map(taskRow).join('')||'<p>No completed tasks yet.</p>'}</section>`}
async function openDoc(docid){let d=state.docs.find(x=>x.id===docid);if(!d)return;if(d.url){window.open(d.url,'_blank','noopener');return}try{let file=await getFile(d.id);if(!file)throw Error('File is not available on this device');let url=URL.createObjectURL(file);window.open(url,'_blank');setTimeout(()=>URL.revokeObjectURL(url),120000)}catch(e){alert(e.message)}}
function render(){let path=decodeURIComponent((location.hash||'#home').slice(1)).split('/'),view=path[0],html=view==='category'?renderCategory(path.slice(1).join('/')):view==='project'&&proj(path[1])?renderProject(proj(path[1])):view==='task'&&task(path[1])?renderTask(task(path[1])):view==='library'?renderLibrary():view==='attach'?renderAttach(path[1],path[2]):view==='completed'?renderCompleted():renderHome();$('app').innerHTML=html;document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>route(b.dataset.go));document.querySelectorAll('[data-done]').forEach(b=>b.onchange=()=>{let t=task(b.dataset.done);t.done=b.checked;t.completedAt=t.done?date():null;t.updatedBy=state.author;save();render()});document.querySelectorAll('[data-open-doc]').forEach(b=>b.onclick=()=>openDoc(b.dataset.openDoc));if(view==='category')$('newProject').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);state.projects.push({id:id(),name:f.get('name').trim(),category:path.slice(1).join('/'),createdBy:state.author,createdAt:date()});save();render()};if(view==='project'){let p=proj(path[1]);$('newTask').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);state.tasks.push({id:id(),title:f.get('title').trim(),due:f.get('due'),projectId:p.id,done:false,notes:'',createdBy:state.author,createdAt:date()});save();render()};$('showDone').onclick=()=>$('donePanel').classList.toggle('hidden')}if(view==='task'){let t=task(path[1]);$('saveTask').onclick=()=>{t.contactName=$('contactName').value;t.contactPhone=$('contactPhone').value;t.contactEmail=$('contactEmail').value;t.notes=$('taskNotes').value;t.updatedBy=state.author;t.updatedAt=date();save();render()};$('toggleTask').onclick=()=>{t.done=!t.done;t.completedAt=t.done?date():null;t.updatedBy=state.author;save();render()}}if(view==='attach'){let kind=path[1],target=path[2],owner=kind==='project'?proj(target):task(target);let show=()=>{let q=$('attachSearch').value.toLowerCase();let matches=state.docs.filter(d=>(d.title+' '+(d.description||'')+' '+(d.filename||'')).toLowerCase().includes(q));$('attachResults').innerHTML=matches.map(d=>{let linked=kind==='project'?(d.projectIds||[d.projectId].filter(Boolean)).includes(target):(d.taskIds||[d.taskId].filter(Boolean)).includes(target);return `<div class="item"><div class="grow"><strong>${esc(d.title)}</strong><div class="small">${esc(d.description||d.filename||'')}</div></div><button data-open-doc="${d.id}">Open</button><button data-attach-doc="${d.id}" ${linked?'disabled':''}>${linked?'Attached':'Attach'}</button></div>`}).join('')||'<p>No matching documents. Add a document from the library page.</p>';$('attachResults').querySelectorAll('[data-open-doc]').forEach(b=>b.onclick=()=>openDoc(b.dataset.openDoc));$('attachResults').querySelectorAll('[data-attach-doc]').forEach(b=>b.onclick=()=>{let d=state.docs.find(x=>x.id===b.dataset.attachDoc);let key=kind==='project'?'projectIds':'taskIds';d[key]=[...new Set([...(d[key]||[d[kind==='project'?'projectId':'taskId']].filter(Boolean)),target])];d.updatedAt=date();save();show()})};$('attachSearch').oninput=show;show()}
if(view==='library'){let show=()=>{let q=$('docSearch').value.toLowerCase();let docs=state.docs.filter(d=>(d.title+' '+d.description+' '+(d.projectIds||[d.projectId].filter(Boolean)).map(x=>proj(x)?.name||'').join(' ')+' '+(d.taskIds||[d.taskId].filter(Boolean)).map(x=>task(x)?.title||'').join(' ')).toLowerCase().includes(q));$('docResults').innerHTML=docs.map(docRow).join('')||'<p>No matching documents.</p>';$('docResults').querySelectorAll('[data-open-doc]').forEach(b=>b.onclick=()=>openDoc(b.dataset.openDoc))};$('docSearch').oninput=show;$('addDoc').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),file=f.get('file'),url=String(f.get('url')||'').trim();if((!file||!file.size)&&!url){alert('Choose a file or enter a document URL.');return}let d={id:id(),title:String(f.get('title')).trim(),projectId:f.get('projectId'),taskId:f.get('taskId'),description:f.get('description'),url,filename:file?.size?file.name:'',createdBy:state.author,createdAt:date()};try{if(file?.size){if(!db)throw Error('Local file storage is unavailable');await putFile(d.id,file)}d.projectIds=d.projectId?[d.projectId]:[];d.taskIds=d.taskId?[d.taskId]:[];state.docs.push(d);save();render()}catch(err){alert('Unable to save document: '+err.message)}}}}
try{state=JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch{state=structuredClone(seed)}state.projects??=[];state.tasks??=[];state.docs??=[];state.author??='';openDB().then(x=>db=x).catch(()=>{});window.addEventListener('hashchange',render);render();
</script></body></html>
